    <text x="1070" y="199" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#526277">LINUX AUDIT</text>
    <circle cx="783" cy="242" r="3" fill="#a78bfa"/>
