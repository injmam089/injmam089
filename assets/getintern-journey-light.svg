    <text x="774" y="525" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.15" fill="#f472b6">INCIDENT RESPONSE</text>
    <text x="1070" y="525" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="650" fill="#718096">06 / 06</text>
