    <text x="412" y="525" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.15" fill="#2dd4bf">DEFENSIVE TELEMETRY</text>
    <text x="708" y="525" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="650" fill="#718096">05 / 06</text>
