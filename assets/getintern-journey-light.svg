    <text x="72" y="249" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a">Network reconnaissance</text>
    <text x="50" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#526277">Host discovery and local network mapping.</text>
    <line x1="50" y1="303" x2="346" y2="303" stroke="#dbe4ee" stroke-width="1"/>
    <text x="50" y="323" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.15" fill="#34d399">DISCOVERY</text>
