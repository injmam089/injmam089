    <rect x="410" y="384" width="78" height="25" rx="12.5" fill="#f0f4f8" stroke="#d7e1eb" stroke-width=".7"/>
    <text x="449" y="401" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1" fill="#2dd4bf">WEEK 05</text>
    <text x="708" y="401" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#526277">LOG ANALYSIS</text>
