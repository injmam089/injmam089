    <text x="72" y="451" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a">Linux system hardening</text>
    <text x="50" y="481" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#526277">Apply safeguards and reduce system exposure.</text>
    <line x1="50" y1="505" x2="346" y2="505" stroke="#dbe4ee" stroke-width="1"/>
    <text x="50" y="525" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.15" fill="#fbbf24">DEFENSE</text>
    <text x="346" y="525" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="650" fill="#718096">04 / 06</text>
  </g>
  <g>
