    <text x="412" y="323" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.15" fill="#38bdf8">ATTACK SURFACE</text>
    <text x="708" y="323" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="650" fill="#718096">02 / 06</text>
