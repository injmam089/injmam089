    <rect x="48" y="182" width="78" height="25" rx="12.5" fill="#f0f4f8" stroke="#d7e1eb" stroke-width=".7"/>
    <text x="87" y="199" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1" fill="#34d399">WEEK 01</text>
    <text x="346" y="199" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#526277">RECON</text>
