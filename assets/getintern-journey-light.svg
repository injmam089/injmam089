    <text x="774" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#526277">Inspect configuration and system security.</text>
    <line x1="774" y1="303" x2="1070" y2="303" stroke="#dbe4ee" stroke-width="1"/>
    <text x="774" y="323" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.15" fill="#a78bfa">SYSTEM VISIBILITY</text>
    <text x="1070" y="323" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="650" fill="#718096">03 / 06</text>
