  <text x="560" y="579" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#526277">DISCOVER  →  AUDIT  →  HARDEN  →  ANALYZE  →  DETECT</text>
</svg>