    <text x="594" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.15" fill="#38bdf8">SECURE CONFIGURATION</text>
    <text x="1070" y="326" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="650" fill="#718096">02 / 04</text>
  </g>
  <g>
    <rect x="28" y="366" width="520" height="180" rx="17" fill="#ffffff" stroke="#d7e1eb" stroke-width="1.2"/>
    <rect x="28" y="382" width="4" height="148" rx="2" fill="#a78bfa"/>
    <rect x="48" y="384" width="78" height="25" rx="12.5" fill="#f0f4f8" stroke="#d7e1eb" stroke-width=".7"/>
    <text x="87" y="401" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1" fill="#a78bfa">WEEK 03</text>
    <text x="526" y="401" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#526277">INCIDENT HANDLING</text>
    <circle cx="59" cy="445" r="3" fill="#a78bfa"/>
    <text x="72" y="452" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Incident response simulation</text>
    <text x="50" y="482" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#526277">Practice response activities through a simulation.</text>
    <line x1="50" y1="506" x2="526" y2="506" stroke="#dbe4ee" stroke-width="1"/>
    <text x="50" y="526" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.15" fill="#a78bfa">INCIDENT RESPONSE</text>
    <text x="526" y="526" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="650" fill="#718096">03 / 04</text>
  </g>
  <g>
    <rect x="572" y="366" width="520" height="180" rx="17" fill="#ffffff" stroke="#d7e1eb" stroke-width="1.2"/>
    <rect x="572" y="382" width="4" height="148" rx="2" fill="#fbbf24"/>
    <rect x="592" y="384" width="78" height="25" rx="12.5" fill="#f0f4f8" stroke="#d7e1eb" stroke-width=".7"/>
    <text x="631" y="401" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1" fill="#fbbf24">WEEK 04</text>
    <text x="1070" y="401" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#526277">SECURITY GOVERNANCE</text>
    <circle cx="603" cy="445" r="3" fill="#fbbf24"/>
    <text x="616" y="452" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Security policy review</text>
    <text x="594" y="482" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#526277">Review security policies and their purpose.</text>
    <line x1="594" y1="506" x2="1070" y2="506" stroke="#dbe4ee" stroke-width="1"/>
    <text x="594" y="526" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.15" fill="#fbbf24">POLICY REVIEW</text>
    <text x="1070" y="526" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="650" fill="#718096">04 / 04</text>
  </g>
  <text x="560" y="579" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#526277">ASSESS THREATS  →  SECURE NETWORKS  →  RESPOND  →  REVIEW</text>
</svg>