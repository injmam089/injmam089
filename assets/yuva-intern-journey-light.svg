<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="592" viewBox="0 0 1120 592" role="img" aria-labelledby="title desc">
  <title id="title">YuvaIntern cyber security analyst journey — Weeks 1 to 4</title>
  <desc id="desc">Four visual assignment cards covering cyber threat landscape analysis, network security configuration, incident response simulation, and security policy review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#edf3f8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#047857" stop-opacity=".10"/>
      <stop offset="1" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1120" height="592" rx="24" fill="url(#background)"/>
  <circle cx="1010" cy="44" r="190" fill="url(#glow)"/>
  <rect x="1" y="1" width="1118" height="590" rx="23" fill="none" stroke="#d7e1eb" stroke-width="1.2"/>
  <rect x="30" y="28" width="7" height="22" rx="3.5" fill="#047857"/>
  <text x="50" y="44" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="2" fill="#047857">YUVAINTERN  /  CYBER SECURITY ANALYST</text>
  <text x="30" y="91" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="760" letter-spacing="-.8" fill="#0f172a">From threat awareness to security governance</text>
  <text x="31" y="121" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#526277">Four documented virtual internship assignments across security analysis and response.</text>
  <rect x="931" y="30" width="158" height="84" rx="15" fill="#e9f6f0" stroke="#d7e1eb"/>
  <text x="950" y="73" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="780" fill="#0f172a">04</text>
  <text x="950" y="94" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" font-weight="750" letter-spacing="1" fill="#526277">ASSIGNMENTS</text>
  
  <g>
    <rect x="28" y="166" width="520" height="180" rx="17" fill="#ffffff" stroke="#d7e1eb" stroke-width="1.2"/>
    <rect x="28" y="182" width="4" height="148" rx="2" fill="#34d399"/>
    <rect x="48" y="184" width="78" height="25" rx="12.5" fill="#f0f4f8" stroke="#d7e1eb" stroke-width=".7"/>
