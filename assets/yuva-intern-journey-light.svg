    <text x="526" y="201" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#526277">THREAT LANDSCAPE</text>
    <circle cx="59" cy="245" r="3" fill="#34d399"/>
    <text x="72" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Cyber threat landscape analysis</text>
    <text x="50" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#526277">Explore the cyber threat landscape and key risks.</text>
    <line x1="50" y1="306" x2="526" y2="306" stroke="#dbe4ee" stroke-width="1"/>
    <text x="50" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.15" fill="#34d399">THREAT AWARENESS</text>
    <text x="526" y="326" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="650" fill="#718096">01 / 04</text>
