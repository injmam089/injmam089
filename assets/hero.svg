<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#061219"/><stop offset=".55" stop-color="#0a2830"/><stop offset="1" stop-color="#12343a"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#63f1df"/><stop offset="1" stop-color="#28b9ff"/></linearGradient>
  <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff7657"/><stop offset="1" stop-color="#ffb36b"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#9de7df" stroke-opacity=".06"/></pattern>
</defs>

<rect width="1400" height="520" rx="32" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="518" rx="31" fill="url(#grid)" stroke="#25484e"/>

<!-- ambient rings -->
<g fill="none" stroke="#7ce8dc" stroke-opacity=".12">
  <circle cx="1100" cy="235" r="210"/><circle cx="1100" cy="235" r="165"/><circle cx="1100" cy="235" r="120"/>
</g>

<!-- left content -->
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="80" y="125" font-size="70" font-weight="800" fill="#effbf8">INJMAM</text>
  <text x="82" y="170" font-size="26" fill="#8de7dc">CYBERSECURITY × FULL-STACK × AI</text>

  <rect x="82" y="205" width="650" height="68" rx="14" fill="#041016" stroke="#28535a"/>
  <text x="108" y="247" font-family="monospace" font-size="22" fill="#ff7657">&gt;</text>
  <text x="140" y="247" font-family="monospace" font-size="21" fill="#e5f6f2">building secure systems</text>
  <rect x="140" y="257" width="9" height="4" fill="#63f1df">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="82" y="322" font-size="18" fill="#94b5b4">BCA Student • Cybersecurity Intern • Developer</text>
  <text x="82" y="355" font-size="18" fill="#94b5b4">Java • Spring Boot • Python • AI • Cloud</text>

  <g transform="translate(82 390)">
    <rect width="188" height="42" rx="21" fill="#0b3136" stroke="#29666a"/>
    <text x="94" y="27" text-anchor="middle" font-size="15" fill="#baf5ed">LEARN</text>
    <rect x="202" width="188" height="42" rx="21" fill="#0b3136" stroke="#29666a"/>
    <text x="296" y="27" text-anchor="middle" font-size="15" fill="#baf5ed">BUILD</text>
    <rect x="404" width="188" height="42" rx="21" fill="#0b3136" stroke="#29666a"/>
    <text x="498" y="27" text-anchor="middle" font-size="15" fill="#baf5ed">SECURE</text>
  </g>
</g>

<!-- network scene -->
<g stroke-linecap="round">
  <path d="M790 370 C860 370 850 285 925 285 S1000 180 1080 180 S1170 245 1265 205" fill="none" stroke="#274e54" stroke-width="5"/>
  <path d="M790 370 C860 370 850 285 925 285 S1000 180 1080 180 S1170 245 1265 205" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-dasharray="12 16">
    <animate attributeName="stroke-dashoffset" from="0" to="-140" dur="3s" repeatCount="indefinite"/>
  </path>
  <g fill="#63f1df" filter="url(#glow)">
    <circle cx="790" cy="370" r="9"><animate attributeName="r" values="8;13;8" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="925" cy="285" r="9"><animate attributeName="r" values="8;13;8" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="180" r="9"><animate attributeName="r" values="8;13;8" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="1265" cy="205" r="9"><animate attributeName="r" values="8;13;8" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
</g>

<!-- laptop -->
<g transform="translate(748 335)">
  <rect width="112" height="68" rx="8" fill="#0a1d24" stroke="#63f1df" stroke-width="3"/>
  <rect x="10" y="10" width="92" height="45" rx="4" fill="#061219"/>
  <text x="18" y="30" font-family="monospace" font-size="11" fill="#63f1df">&gt; scan</text>
  <text x="18" y="45" font-family="monospace" font-size="9" fill="#ff7657">● SECURE</text>
  <path d="M-14 70H126L110 80H2Z" fill="#183840" stroke="#63f1df"/>
</g>

<!-- shield -->
<g transform="translate(1028 120)">
  <path d="M52 0L105 20V62C105 101 82 126 52 140C22 126 0 101 0 62V20Z" fill="#0a242b" stroke="url(#cyan)" stroke-width="4" filter="url(#glow)"/>
  <path d="M52 26V105M28 66H76" stroke="#63f1df" stroke-width="7" stroke-linecap="round"/>
  <circle cx="52" cy="66" r="10" fill="#ff7657"><animate attributeName="opacity" values=".45;1;.45" dur="1.4s" repeatCount="indefinite"/></circle>
</g>

<!-- cloud -->
<g transform="translate(1190 250)" fill="#0c2b32" stroke="#9de7df" stroke-width="3">
  <path d="M0 55C0 35 16 20 35 20C44 2 68 0 82 14C105 12 121 28 121 48C121 67 106 80 87 80H28C12 80 0 69 0 55Z"/>
</g>

<text x="1065" y="390" font-family="monospace" font-size="15" fill="#8fb0ae">SECURITY NODE ACTIVE</text>
</svg>
