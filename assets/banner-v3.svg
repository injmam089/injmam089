<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Injmam Ansari — Premium Developer Profile</title>
  <desc id="desc">A premium dark navy portfolio banner with emerald, cyan and violet accents, introducing a BCA student, cybersecurity intern and full-stack developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset=".55" stop-color="#101b2c"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity=".8"/>
      <stop offset=".52" stop-color="#38bdf8" stop-opacity=".65"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#10b981" stop-opacity=".22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity=".075" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.1" fill="#94a3b8" fill-opacity=".13"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="970" cy="155" r="255" fill="url(#glowA)"/>
  <circle cx="1080" cy="270" r="220" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="url(#edge)" stroke-opacity=".55" stroke-width="1.5"/>

