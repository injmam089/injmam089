    <circle cx="190" cy="132" r="92" fill="none" stroke="url(#edge)" stroke-opacity=".5"/>
    <path d="M190 42L265 70V133C265 190 230 226 190 246C150 226 115 190 115 133V70Z" fill="#0c2e2b" stroke="#34d399" stroke-width="3"/>
