    <rect x="74" y="52" width="202" height="30" rx="15" fill="#0f2b29" stroke="#34d399" stroke-opacity=".55"/>
    <circle cx="92" cy="67" r="4" fill="#34d399"/>
    <text x="106" y="72" font-size="12" font-weight="700" letter-spacing="1.8" fill="#a7f3d0">PORTFOLIO  /  2026</text>

    <text x="72" y="158" fill="url(#word)" font-size="66" font-weight="760" letter-spacing="-2.4">Injmam Ansari</text>
