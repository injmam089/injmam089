      <text x="0" y="0">LEARN</text>
      <circle cx="43" cy="-4" r="2" fill="#34d399"/>
      <text x="53" y="0">BUILD</text>
      <circle cx="97" cy="-4" r="2" fill="#38bdf8"/>
