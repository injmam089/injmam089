      <rect x="76" y="292" width="122" height="34" rx="17" fill="#064e3b" fill-opacity=".65" stroke="#34d399" stroke-opacity=".75"/>
      <circle cx="94" cy="309" r="4" fill="#34d399"/>
      <text x="108" y="313" fill="#d1fae5">SECURITY</text>

      <rect x="210" y="292" width="120" height="34" rx="17" fill="#0c3550" fill-opacity=".72" stroke="#38bdf8" stroke-opacity=".7"/>
      <circle cx="228" cy="309" r="4" fill="#38bdf8"/>
      <text x="242" y="313" fill="#dbeafe">BACKEND</text>

      <rect x="342" y="292" width="132" height="34" rx="17" fill="#312e61" fill-opacity=".7" stroke="#a78bfa" stroke-opacity=".7"/>
      <circle cx="360" cy="309" r="4" fill="#a78bfa"/>
      <text x="374" y="313" fill="#ede9fe">FULL STACK</text>
