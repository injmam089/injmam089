      <circle cx="315" cy="80" r="10" stroke="#38bdf8"/>
      <circle cx="82" cy="215" r="10" stroke="#a78bfa"/>
      <circle cx="299" cy="225" r="10" stroke="#34d399"/>
    </g>
    <g stroke-width="2" fill="none" opacity=".8">
