    <rect x="140" y="180" width="34" height="4" rx="2" fill="#38bdf8"/>
    <rect x="180" y="180" width="20" height="4" rx="2" fill="#a78bfa"/>

    <text x="76" y="222" fill="#e2e8f0" font-size="22" font-weight="560">Cybersecurity  ·  Backend Engineering  ·  Full-Stack Development</text>
    <text x="76" y="258" fill="#94a3b8" font-size="17">BCA student building practical software and learning to secure the systems behind it.</text>

